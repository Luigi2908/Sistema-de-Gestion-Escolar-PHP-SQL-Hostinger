<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #001f3f; color: #fff; text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 360px; }
  .mark {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    width: 84px; height: 84px; margin: 0 auto 26px;
  }
  .mark span { border-radius: 6px; background: #fff; opacity: .95; }
  .mark span:nth-child(2) { background: #0074D9; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.5; color: #b9c6d6; margin-bottom: 26px; }
  button {
    background: #0074D9; color: #fff; border: none; border-radius: 10px;
    padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span></span><span></span><span></span><span></span></div>
    <h1>You're offline</h1>
    <p>We couldn't reach the server. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
