name: Despliegue Automático a Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'SAAS ORMS RESULT/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar archivos con Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Normalizar Host FTP
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z]*://||' -e 's|:.*||' -e 's|/.*||' | tr -d '[:space:]')
          echo "FTP_CLEAN_SERVER=$CLEAN_SERVER" >> $GITHUB_ENV

      - name: Inspeccionar carpetas en Hostinger
        run: |
          echo "=== Directorio actual FTP ==="
          curl -s -k --ftp-ssl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ env.FTP_CLEAN_SERVER }}:21/" || true
          echo "=== Directorio padre (..) ==="
          curl -s -k --ftp-ssl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ env.FTP_CLEAN_SERVER }}:21/../" || true

      - name: Desplegar archivos por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_CLEAN_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: './SAAS ORMS RESULT/'
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            uploads/**
            error_log.txt
            *.log
            *.sql
            MEMORY.md
            requirement.md
            docs/**
